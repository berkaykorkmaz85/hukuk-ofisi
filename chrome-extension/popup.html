<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #fff;
      color: #1a1a1a;
    }
    .header {
      padding: 12px 14px;
      background: #1e40af;
      color: white;
      font-weight: 600;
      font-size: 14px;
    }
    .header span { opacity: 0.8; font-size: 12px; font-weight: 400; margin-left: 6px; }
    .empty {
      padding: 28px 16px;
      text-align: center;
      color: #6b7280;
      line-height: 1.6;
    }
    .item {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
    }
    .item:last-child { border-bottom: none; }
    .dosya-adi {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .evrak-adi {
      font-weight: 500;
      margin-bottom: 2px;
    }
    .tarih {
      font-size: 11px;
      color: #9ca3af;
    }
    .footer {
      padding: 10px 14px;
      border-top: 1px solid #e5e7eb;
    }
    .clear-btn {
      width: 100%;
      padding: 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .clear-btn:hover { background: #1d4ed8; }
    .reset-btn {
      width: 100%;
      padding: 7px;
      background: none;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 6px;
    }
    .reset-btn:hover { background: #fef2f2; color: #dc2626; border-color: #fca5a5; }
    .reset-ok { font-size: 12px; color: #16a34a; text-align: center; margin-top: 6px; }
    .list { max-height: 380px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="header">⚖️ UYAP Evrak Takip <span>yeni evrak bildirimi</span></div>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
